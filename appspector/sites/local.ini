# The laptop itself: programs run as local processes, no scheduler, no
# forward. {appspector} is this repository; {work} is where logs go.
[site]
scheduler = local
work = {appspector}/runs
default_pes = 4
port = 1234
auth = yes

[programs]
pfield = {appspector}/apps/pfield | ./pfield {args} +pe {pes} ++server ++server-port {port} +balancer GreedyRefineLB
wave2d = {appspector}/charm-wt/examples/charm++/wave2d | ./wave2d-demo {args} +pe {pes} ++server ++server-port {port}
wave2d-small = {appspector}/charm-wt/examples/charm++/wave2d | ./wave2d-small {args} +pe {pes} ++server ++server-port {port}
ccstest = {appspector}/charm-wt/examples/converse/ccstest | ./server {args} +pe {pes} ++server ++server-port {port}
